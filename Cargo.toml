[package]
name = "nsz-converter"
version = "1.0.0"
description = "Production-ready NSZ to NSP converter with auto-monitoring"
authors = ["Sisyphus"]
license = "MIT"
repository = "https://github.com/sigmachan/nsz-converter"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
flate2 = "1"
zstd = "0.13"
hex = "0.4"
walkdir = "2"
regex = "1"
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
