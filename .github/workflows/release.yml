name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: frontend

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            pkg-config

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cd frontend && npm run build && cd .. && cargo tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cd frontend && npm run build; cd ..; cargo tauri build --target ${{ matrix.target }} --bundles msi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cd frontend && npm run build && cd .. && cargo tauri build --target ${{ matrix.target }} --bundles appimage,deb

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "NSZ Converter ${{ steps.tag.outputs.tag }}"
          body: |
            ## NSZ Converter ${{ steps.tag.outputs.tag }}
            
            Production-ready NSZ ↔ NSP converter with beautiful Discord-style GUI.
            
            ### Downloads
            
            | Platform | File | Format |
            |----------|------|--------|
            | 🍎 macOS ARM64 (Apple Silicon) | `.dmg` | Disk Image |
            | 🍎 macOS x64 (Intel) | `.dmg` | Disk Image |
            | 🪟 Windows x64 | `.msi` | Installer |
            | 🐧 Linux x64 | `.AppImage` | Portable |
            | 🐧 Linux x64 | `.deb` | Debian Package |
            
            ### Requirements
            - Nintendo Switch `prod.keys` file (user-provided)
            - NSZ runtime auto-downloads on first run (no Python needed)
            
            ### Installation
            - **macOS**: Open `.dmg`, drag to Applications
            - **Windows**: Run `.msi` installer  
            - **Linux**: `chmod +x *.AppImage && ./nsz-converter*.AppImage`
            
            ### Documentation
            - [Architecture](https://github.com/Sigmachan/nsz-converter/blob/master/ARCHITECTURE.md)
            - [Build from source](https://github.com/Sigmachan/nsz-converter/blob/master/BUILD.md)
          files: |
            macos-arm64/**
            macos-x64/**
            windows-x64/**
            linux-x64/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
