name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: macos-arm64
          - target: x86_64-apple-darwin
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build app
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked
      - name: Build frontend
        run: cd frontend; npm ci; npm run build
      - name: Build app
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev pkg-config
      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build app
        run: cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "NSZ Converter ${{ steps.tag.outputs.tag }}"
          body: |
            ## NSZ Converter ${{ steps.tag.outputs.tag }}
            
            Production-ready NSZ ↔ NSP converter with beautiful Discord-style GUI.
            
            ### Downloads
            
            | Platform | File | Format |
            |----------|------|--------|
            | 🍎 macOS ARM64 | `.dmg` | Disk Image |
            | 🍎 macOS x64 | `.dmg` | Disk Image |
            | 🪟 Windows x64 | `.msi` | Installer |
            | 🐧 Linux x64 | `.AppImage` | Portable |
            | 🐧 Linux x64 | `.deb` | Debian Package |
            
            ### Requirements
            - Nintendo Switch `prod.keys` file (user-provided)
            - NSZ runtime auto-downloads on first run
            
            ### Installation
            - **macOS**: Open `.dmg`, drag to Applications
            - **Windows**: Run `.msi` installer
            - **Linux**: `chmod +x *.AppImage && ./nsz-converter*.AppImage`
          files: |
            macos-arm64/**
            macos-x64/**
            windows-x64/**
            linux-x64/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
