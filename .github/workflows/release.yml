name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "NSZ Converter ${{ steps.tag.outputs.tag }}" \
            --notes "
            ## NSZ Converter ${{ steps.tag.outputs.tag }}
            
            Production-ready NSZ ↔ NSP converter with beautiful Discord-style GUI.
            
            ### Features
            - Cross-platform support (macOS, Windows, Linux)
            - Embedded nsz runtime (no Python needed)
            - Auto file monitoring and conversion
            - Game folder organization
            
            ### Building Locally
            See BUILD.md for instructions.
            "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
