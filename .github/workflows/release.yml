name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: echo "Hello from CI"
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "NSZ Converter ${{ steps.tag.outputs.tag }}"
          body: |
            ## NSZ Converter ${{ steps.tag.outputs.tag }}
            
            Initial release with:
            - Beautiful Discord-style GUI
            - Cross-platform support (macOS, Windows, Linux)
            - NSZ → NSP conversion with embedded runtime
            - Auto file monitoring
            - Game folder organization
            
            ### Downloads
            - 🍎 macOS: Coming soon (build locally with `cargo tauri build`)
            - 🪟 Windows: Coming soon
            - 🐧 Linux: Coming soon
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
